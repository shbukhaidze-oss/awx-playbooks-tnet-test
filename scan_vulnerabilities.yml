---
- name: Enterprise Linux Compliance & Vulnerability Scanner
  hosts: all
  gather_facts: yes

  tasks:
    - name: 0. Check effective user
      ansible.builtin.command: whoami
      register: whoami_result
      become: yes
      become_user: root
      become_method: sudo

    - name: 1. Refresh APT package index
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes
      become_user: root
      become_method: sudo

    - name: 2. Check for reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_check

    - name: 3. Parse detailed package update list
      ansible.builtin.shell: |
        python3 -c '
        import subprocess, json
        raw = subprocess.check_output(["apt-get", "-s", "dist-upgrade"]).decode("utf-8")
        pkgs = []
        for line in raw.splitlines():
            if line.startswith("Inst "):
                parts = line.split()
                name = parts[1]
                current_v = parts[2].replace("[", "").replace("]", "") if len(parts) > 2 else "unknown"
                new_v = parts[3].replace("(", "").replace(")", "") if len(parts) > 3 else "unknown"
                is_sec = "security" in line.lower()
                pkgs.append({
                    "package": name,
                    "current_version": current_v,
                    "new_version": new_v,
                    "is_security": is_sec
                })
        print(json.dumps(pkgs))
        '
      register: detailed_packages_raw
      changed_when: false
      become: yes
      become_user: root
      become_method: sudo

    - name: 4. Parse metrics & build structured JSON
      ansible.builtin.set_fact:
        scan_results:
          hostname: "{{ ansible_hostname }}"
          ip_address: "{{ ansible_default_ipv4.address }}"
          os_version: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          reboot_required: "{{ reboot_check.stat.exists }}"
          total_pending_packages: "{{ (detailed_packages_raw.stdout | from_json) | length }}"
          security_packages_count: "{{ (detailed_packages_raw.stdout | from_json) | selectattr('is_security', 'equalto', true) | list | length }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          packages: "{{ detailed_packages_raw.stdout | from_json }}"

    - name: 5. Output Scan Summary & Package Inventory to AWX Console
      ansible.builtin.debug:
        var: scan_results
