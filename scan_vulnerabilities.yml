---
- name: Enterprise Linux Compliance & Vulnerability Scanner
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: 1. Refresh APT package index
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Check for reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_check

    - name: 3. Retrieve list of upgradable packages
      ansible.builtin.command: apt list -u --upgradable
      register: apt_upgradable_raw
      changed_when: false

    - name: 4. Retrieve security updates list
      ansible.builtin.shell: |
        apt-get -s dist-upgrade | grep "^Inst" | grep -i security || true
      register: security_updates_raw
      changed_when: false

    - name: 5. Parse metrics into structured JSON
      ansible.builtin.set_fact:
        scan_results:
          hostname: "{{ ansible_hostname }}"
          ip_address: "{{ ansible_default_ipv4.address }}"
          os_version: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          reboot_required: "{{ reboot_check.stat.exists }}"
          total_pending_packages: "{{ apt_upgradable_raw.stdout_lines | length - 1 }}"
          security_packages_count: "{{ security_updates_raw.stdout_lines | length }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"

    - name: 6. Output Scan Summary to AWX Console
      ansible.builtin.debug:
        var: scan_results
